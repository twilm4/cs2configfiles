unbindall

//aliases 
alias dc "disconnect"
alias fast_training_map "map_workshop 3083320026 fast"
alias training "fast_training_map"
//Connect to current warmupserver.net IP Adresses 
// warmupserver_dust 51.161.199.215:27075
// alias deathmatch_dust connect "51.161.199.215:27075"
// alias dm_dust "deathmatch_dust"
// warmupserver mirage 51.161.199.215:27115
// alias deathmatch_mirage connect "51.161.199.215:27115"
// alias dm_mirage "deathmatch_mirage"

//quickswitch bind 
alias +qsw "slot3";alias -qsw "lastinv"; bind q +qsw

//startup commands
joystick "0"
//general keybinds 
bind "w" "+forward"
bind "a" "+left"
bind "s" "+back"
bind "d" "+right"
bind "CTRL" "+duck"
bind "SHIFT" "+sprint"
bind "SPACE" "+jump"
bind "MWHEELDOWN" "+jump"
bind "MOUSE_X" "yaw"
bind "MOUSE_Y" "pitch"

bind "TAB" "+showscores"
bind "b" "buymenu"
bind "ESCAPE" "cancelselect"
bind "`" "toggleconsole" 

bind "MOUSE1" "+attack"
bind "MOUSE2" "+attack2"
bind "r" "+reload"
bind "e" "+use"
bind "g" "drop"
bind "f" "+lookatweapon"

bind "1" "slot1"
bind "2" "slot2"
bind "3" "slot3"
bind "4" "slot4"
bind "MWHEELUP" "invprev"

bind "ENTER" "messagemode"
bind "y" "messagemode2"
bind "mouse5" "player_ping"

//nade binds
bind "kp_1" "buy vesthelm;buy vest;"
bind "kp_2" "buy rifle1;"
bind "kp_3" "buy awp;"
bind  "z"  "+lineupcrosshair; buy flashbang; slot7"
bind  "v"  "+lineupcrosshair; buy incgrenade; slot10"
bind  "c"  "+lineupcrosshair; buy smokegrenade; slot8"
bind  "x"  "buy hegrenade; slot6"


//viewmodel 
viewmodel_fov 68
viewmodel_offset_x 2.5
viewmodel_offset_y 2.0
viewmodel_offset_z -2.0
viewmodel_presetpos 1
// OLD VIEWMODEL SETTINGS 
//cl_usenewbob 0
//l_righthand 1
//cl_bobamt_lat 0
//cl_bobamt_vert 0
//cl_bob_lower_amt 0
//cl_viewmodel_shift_left_amt 0.6
//l_viewmodel_shift_right_amt  0.6

//hud 
apply_crosshair_code "CSGO-DvQK7-Fk39C-GtZrQ-QEL4a-TXaUN"
sensitivity 1.0
zoom_sensitivity_ratio 0.818933027098955175
cl_crosshair_sniper_width 1

+cl_show_team_equipment
cl_showloadout "1"
cl_autohelp "0"
cl_sanitize_player_names "0"
hud_showtargetid "1"
gameinstructor_enable "0"
cl_hud_color "10" 

cl_radar_rotate 1
cl_radar_scale 0.35
cl_radar_icon_scale_min 0.7
cl_hud_radar_scale 1.15
cl_teammate_colors_show 2
//cl_hud_bomb_under_radar "1"
//cl_hud_playercount_showcount 1
cl_radar_square_with_scoreboard 0
cl_radar_always_centered 0

alias +vrboost "cl_radar_scale 0.75"
alias -vrboost "cl_radar_scale 0.45"
bind n +vrboost


//sound and volume 
volume "0.65"
snd_deathcamera_volume "0"
snd_mapobjective_volume "0"
snd_roundstart_volume "0"
snd_tensecondwarning_volume "0.05"
snd_mvp_volume "0.25"
snd_menumusic_volume "0.05"
speaker_config 3
snd_mixahead 0.001
bind "Mouse4" "+voicerecord"
snd_spatialize_lerp "0.8"


//graphical settings
fps_max "250"
r_fullscreen_gamma 2.5
engine_low_latency_sleep_after_client_tick true
r_show_build_info false

//graphical performance settings
cl_disable_ragdolls "1"


//network
rate 1000000

host_writeconfig

